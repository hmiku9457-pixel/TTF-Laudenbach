<body><a class="skip-link" href="#main-content">Direkt zum Inhalt</a>
<div id="header-container"></div><main id="main-content" tabindex="-1"><div class="grid">
<section class="contact-section full-width">
<form action="https://formspree.io/f/xdavygne" class="contact-form" id="contactForm" method="POST">
<h1>Kontakt</h1>
<input name="_subject" type="hidden" value="Neue Nachricht über ttf-laudenbach.de"/>
<div class="form-group">
<label for="name">Dein Name *</label>
<input id="name" name="name" required="" type="text"/>
</div>
<div class="form-group">
<label for="email">Deine E-Mail *</label>
<input id="email" name="email" required="" type="email"/>
</div>
<div class="form-group">
<label for="message">Deine Nachricht an uns *</label>
<textarea id="message" name="message" required="" rows="5"></textarea>
</div>
<div class="form-group form-consent">
<input id="consent" name="consent" required="" type="checkbox"/>
<label for="consent">
					  Ich stimme der Verarbeitung meiner Daten gemäß der
					  <a href="/pages/footer/datenschutz.html">Datenschutzerklärung</a>
					  zu. *
					</label>
</div>
<button class="button contact-submit-button" id="contactSubmitButton" type="submit">
					  Nachricht senden
				  </button><p aria-atomic="true" aria-live="polite" class="form-status" id="contactFormStatus" role="status"></p>
</form>
</section>
</div><!-- externes JS --></main><div id="footer-container"></div>



<script src="/assets/js/main.js" type="module"></script>
</body>
