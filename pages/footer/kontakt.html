<!DOCTYPE html>
<html lang="de">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- externes CSS -->
		<link rel="stylesheet" href="/assets/css/style.css">

		<!-- SEO: TTF Phase 3 -->
		<title>Kontakt | TTF Laudenbach</title>
		<meta name="description" content="Kontaktmöglichkeiten und Ansprechpartner der Tischtennis-Freunde Laudenbach.">
		<meta name="robots" content="index, follow, max-image-preview:large">
		<link rel="canonical" href="https://www.ttf-laudenbach.de/pages/footer/kontakt.html">

		<meta property="og:locale" content="de_DE">
		<meta property="og:type" content="website">
		<meta property="og:site_name" content="TTF Laudenbach">
		<meta property="og:title" content="Kontakt | TTF Laudenbach">
		<meta property="og:description" content="Kontaktmöglichkeiten und Ansprechpartner der Tischtennis-Freunde Laudenbach.">
		<meta property="og:url" content="https://www.ttf-laudenbach.de/pages/footer/kontakt.html">
		<meta property="og:image" content="https://www.ttf-laudenbach.de/assets/images/seo/ttf-laudenbach-social.png">
		<meta property="og:image:width" content="1200">
		<meta property="og:image:height" content="630">
		<meta property="og:image:type" content="image/png">
		<meta property="og:image:alt" content="Logo der Tischtennis-Freunde Laudenbach">

		<meta name="twitter:card" content="summary_large_image">
		<meta name="twitter:title" content="Kontakt | TTF Laudenbach">
		<meta name="twitter:description" content="Kontaktmöglichkeiten und Ansprechpartner der Tischtennis-Freunde Laudenbach.">
		<meta name="twitter:image" content="https://www.ttf-laudenbach.de/assets/images/seo/ttf-laudenbach-social.png">
		<meta name="twitter:image:alt" content="Logo der Tischtennis-Freunde Laudenbach">
		<!-- SEO: Ende TTF Phase 3 -->
</head>
	
	<body>
	
		<div id="header-container"></div>
		
		<div class="grid">
			<section class="contact-section full-width">
			
				<form
				  id="contactForm"
				  class="contact-form"
				  action="https://formspree.io/f/xdavygne"
				  method="POST">
					
				  <h2>Kontakt</h2>
				
				  <input type="hidden" name="_subject" value="Neue Nachricht über ttf-laudenbach.de">
				
				  <div class="form-group">
					<label for="name">Dein Name *</label>
					<input type="text" id="name" name="name" required>
				  </div>
				
				  <div class="form-group">
					<label for="email">Deine E-Mail *</label>
					<input type="email" id="email" name="email" required>
				  </div>
				
				  <div class="form-group">
					<label for="message">Deine Nachricht an uns *</label>
					<textarea id="message" name="message" rows="5" required></textarea>
				  </div>
				
				  <div class="form-group form-consent">
					<input type="checkbox" id="consent" name="consent" required>
					<label for="consent">
					  Ich stimme der Verarbeitung meiner Daten gemäß der
					  <a href="/TTF-Laudenbach/pages/footer/datenschutz.html">Datenschutzerklärung</a>
					  zu. *
					</label>
				  </div>
				
				  <button id="contactSubmitButton" type="submit" class="button contact-submit-button">
					  Nachricht senden
				  </button>
				</form>
				
			</section>
		</div>
    
		<div id="footer-container"></div>
		
		<!-- externes JS -->
		<script src="/assets/js/script.js" defer></script>
	</body>
</html>
