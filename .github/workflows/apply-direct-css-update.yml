name: Direktes CSS-Update anwenden

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: CSS-Aufbau vereinfachen und Tabellenbug beheben
        run: python tools/direct-css-update/apply_direct_css_update.py

      - name: JavaScript-Syntax prüfen
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets/js -type f -name '*.js' -print0)

      - name: Änderungen anzeigen
        run: git status --short

      - name: Änderungen committen
        shell: bash
        run: |
          git add -A -- . ':(exclude).github/workflows/**'

          if git diff --cached --quiet; then
            echo "Das direkte CSS-Update war bereits vollständig angewendet."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: mobile Spieltabellen und direkten CSS-Import korrigieren"
          git push
