name: Phase 3 Editor-Hotfix anwenden

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: repository-writer
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: News-Abhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check -r assets/python/news_requirements.txt

      - name: Editor-Hotfix anwenden
        run: python tools/phase3-h1-hotfix/apply_phase3_h1_hotfix.py

      - name: Python-Syntax prüfen
        run: python -m py_compile assets/python/generate_news.py

      - name: News mit bestehendem CMS-Testartikel generieren
        run: python assets/python/generate_news.py

      - name: Diff prüfen und committen
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            .pages.yml \
            assets/python/generate_news.py \
            assets/css/components/news-content.css \
            docs/news-content-format.md \
            assets/data/news.json \
            pages/neuigkeiten.html \
            pages/news \
            sitemap.xml

          if git diff --staged --quiet; then
            echo "Keine Änderungen gefunden."
          else
            git status --short
            git commit -m "CMS-News-Editor vollständig unterstützen"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: GitHub Pages neu bauen
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --location --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
