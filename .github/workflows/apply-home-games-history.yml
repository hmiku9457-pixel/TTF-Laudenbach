name: Startseiten-Spiele überarbeiten

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-home-games:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update anwenden
        run: python tools/home-games-history/apply_home_games_history.py

      - name: Update prüfen
        run: python tools/home-games-history/check_home_games_history.py

      - name: JavaScript-Syntax prüfen
        run: |
          node --check assets/js/main.js
          node --check assets/js/config/table-configs.js
          node --check assets/js/features/table-responsive.js
          node --check assets/js/features/home-games.js

      - name: Idempotenz prüfen
        run: |
          git diff --no-ext-diff > /tmp/home-games-before-second-run.diff
          python tools/home-games-history/apply_home_games_history.py
          git diff --no-ext-diff > /tmp/home-games-after-second-run.diff
          diff -u /tmp/home-games-before-second-run.diff /tmp/home-games-after-second-run.diff

      - name: Nach zweitem Lauf erneut prüfen
        run: python tools/home-games-history/check_home_games_history.py

      - name: Einmalige Paketdateien entfernen
        run: |
          rm -rf tools/home-games-history
          rm -f .github/workflows/apply-home-games-history.yml

      - name: Änderungen committen und pushen
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --staged --quiet; then
            echo "Keine Änderungen gefunden."
            exit 0
          fi

          git commit -m "Startseiten-Spiele und Spielhistorie überarbeiten"
          git pull --rebase origin main
          git push origin HEAD:main
