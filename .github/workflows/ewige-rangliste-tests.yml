name: Ewige Rangliste – Tests

on:
  pull_request:
    paths:
      - "assets/python/ewige_rangliste.py"
      - "assets/python/ewige_rangliste_saison.py"
      - "pages/aktiverSpielbetrieb/ewigeRangliste.html"
      - "assets/css/components/ewige-rangliste.css"
      - ".github/workflows/deploy-pages.yml"
      - "assets/python/scrape_ewige_rangliste.py assets/python/ewige_rangliste_saison.py"
      - "assets/python/import_assistant_data.py"
      - "tests/test_import_assistant_data.py"
      - ".github/workflows/assistant-import.yml"
      - "assets/js/features/ewige-rangliste.js"
      - "tests/test_ewige_rangliste.py"
      - "tests/test_ewige_rangliste_saison.py"
      - "tests/test_ewige_rangliste_abstand.mjs"
      - "content/ewige-rangliste/**"
      - "content/assistant-import/**"
      - ".github/workflows/ewige-rangliste-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Python Syntax
        run: python -m py_compile assets/python/ewige_rangliste.py assets/python/scrape_ewige_rangliste.py assets/python/import_assistant_data.py
      - name: Datenmodell, Korrekturen und Stichtage
        run: python -m unittest discover -s tests -p "test_ewige_rangliste.py" -v
      - name: ChatGPT-Import und Konfliktschutz
        run: python -m unittest discover -s tests -p "test_import_assistant_data.py" -v
      - name: Echten Assistenten-Import im temporären Checkout prüfen
        run: python assets/python/import_assistant_data.py
      - name: Saisonstatistik und Mannschaftsmeldung prüfen
        run: python -m unittest discover -s tests -p "test_ewige_rangliste_saison.py" -v
      - name: JavaScript Syntax
        run: node --check assets/js/features/ewige-rangliste.js
      - name: Abstandsberechnung bei Gleichstand
        run: node --experimental-default-type=module --test tests/test_ewige_rangliste_abstand.mjs
