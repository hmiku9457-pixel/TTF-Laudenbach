name: Ewige Rangliste – Tests

on:
  pull_request:
    paths:
      - "assets/python/ewige_rangliste.py"
      - "assets/python/scrape_ewige_rangliste.py"
      - "assets/js/features/ewige-rangliste.js"
      - "tests/test_ewige_rangliste.py"
      - "content/ewige-rangliste/**"
      - ".github/workflows/ewige-rangliste-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Python Syntax
        run: python -m py_compile assets/python/ewige_rangliste.py assets/python/scrape_ewige_rangliste.py
      - name: Datenmodell, Korrekturen und Stichtage
        run: python -m unittest discover -s tests -p "test_ewige_rangliste.py" -v
      - name: JavaScript Syntax
        run: node --check assets/js/features/ewige-rangliste.js
