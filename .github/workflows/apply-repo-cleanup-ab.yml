name: Repo-Cleanup A+B anwenden

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-writer
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Repo-Cleanup anwenden
        run: python tools/repo-cleanup-ab/apply_repo_cleanup.py

      - name: Produktionsdateien prüfen
        shell: bash
        run: |
          python -m compileall -q assets/python tools/repo-cleanup-ab
          find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
          git diff --check

          if git diff --name-only | grep -q '^\.github/workflows/'; then
            echo "Fehler: Das Cleanup-Script darf keine Workflow-Dateien verändern."
            git diff -- .github/workflows/
            exit 1
          fi

      - name: Änderungen committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            .gitignore \
            index.html \
            assets/css/layout/header-navigation.css \
            assets/css/layout/grid-boxes.css \
            assets/css/components/gallery.css \
            assets/css/components/news-slider.css \
            assets/css/components/contact-form.css \
            assets/css/components/ui-buttons.css \
            assets/js/core/

          if git diff --staged --quiet; then
            echo "Keine Änderungen gefunden."
            exit 0
          fi

          if git diff --staged --name-only | grep -q '^\.github/workflows/'; then
            echo "Fehler: Workflow-Dateien wurden unerwartet zum Commit vorgemerkt."
            exit 1
          fi

          git commit -m "Repo-Cleanup CSS und Struktur anwenden"
          git pull --rebase origin main
          git push origin HEAD:main
