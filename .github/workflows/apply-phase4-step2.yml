name: Phase 4 Schritt 2 anwenden

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-4-step-2
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: HTML auf modulare Dateien umstellen
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/apply_phase4_step2.py

      - name: Website-Qualität prüfen
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/quality/check_site.py

      - name: JavaScript-Syntax prüfen
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets/js -type f -name '*.js' -print0)

      - name: Änderungen anzeigen
        run: git diff --stat

      - name: Änderungen committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find . -type f -name '*.html' -print0 | xargs -0 git add --

          if git diff --staged --quiet; then
            echo "Keine Änderungen gefunden."
            exit 0
          fi

          git commit -m "Phase 4: Modulare Assets aktivieren"
          git pull --rebase origin main
          git push origin HEAD:main
