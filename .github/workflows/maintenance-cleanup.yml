name: Wartbarkeits-Cleanup anwenden

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-writer
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Wartbarkeits-Cleanup anwenden
        run: python tools/maintenance-cleanup/apply_maintenance_cleanup.py

      - name: Python-Dateien auf Syntax prüfen
        run: |
          python -m py_compile \
            tools/maintenance-cleanup/apply_maintenance_cleanup.py \
            assets/python/generate_gallery.py \
            assets/python/validate_scraper_data.py

      - name: JavaScript-Dateien auf Syntax prüfen
        run: |
          node --check assets/js/main.js
          node --check assets/js/core/site-components.js
          node --check assets/js/core/page-structure.js

      - name: Scraper-Validator gegen aktuellen Datenstand prüfen
        run: |
          python assets/python/validate_scraper_data.py \
            --before assets/data \
            --candidate assets/data \
            --allow-large-drop

      - name: Änderungen committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Keine Änderungen gefunden."
            exit 0
          fi
          git commit -m "Wartbarkeits-Cleanup anwenden"
          git pull --rebase origin main
          git push origin HEAD:main
