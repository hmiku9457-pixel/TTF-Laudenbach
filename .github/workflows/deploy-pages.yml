name: Website veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - "content/site/**"
      - "content/custom-pages/**"
      - "templates/custom-page.html"
      - "assets/python/generate_site_layout.py"
      - "assets/python/generate_site_navigation.py"
      - "assets/python/generate_cms_status.py"
      - "tests/test_cms_site.py"
      - ".pages.yml"
      - "assets/python/generate_gallery.py"
      - "assets/python/generate_site.py"
      - "assets/python/generate_site_extra.py"
      - "assets/python/generate_site_media.py"
      - "assets/python/generate_news.py"
      - "assets/python/news_requirements.txt"
      - "assets/images/site/**"
      - "assets/images/gallery/**"
      - ".github/workflows/deploy-pages.yml"
      - "index.html"
      - "404.html"
      - "CNAME"
      - "robots.txt"
      - "sitemap.xml"
      - "components/**"
      - "pages/**"
      - "assets/css/**"
      - "assets/js/**"
      - "assets/data/**"
      - "content/ewige-rangliste/delta/**"
      - "content/ewige-rangliste/saison-archiv/**"
      - "content/ewige-rangliste/aktiver-master.json"
      - "assets/images/seo/**"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: CMS-Abhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check -r assets/python/news_requirements.txt

      - name: Öffentliches Website-Artefakt vorbereiten
        id: build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pages-site
          mkdir -p .pages-site/assets

          python assets/python/generate_news.py
          cp index.html 404.html CNAME robots.txt sitemap.xml .pages-site/
          cp -a components pages .pages-site/
          cp -a assets/css assets/data assets/images assets/js .pages-site/assets/

          python assets/python/generate_site.py --output .pages-site
          python assets/python/generate_site_extra.py --output .pages-site
          python assets/python/generate_site_media.py --output .pages-site
          python assets/python/generate_site_navigation.py --output .pages-site

          # Saisonkennzahlen aus den bereits gespeicherten Begegnungen und
          # der Mannschaftsmeldung erzeugen; kein zusätzlicher Datenabruf.
          python assets/python/ewige_rangliste_saison.py --output .pages-site/assets/data/ewigeRanglisteSaison.json
          test -f .pages-site/assets/data/ewigeRanglisteSaison.json

          python -m unittest discover -s tests -p 'test_cms_site.py'
          python -c "from pathlib import Path; assert not any('<!-- CMS:' in p.read_text() or '{{CMS_' in p.read_text() or '<!-- LAYOUT:' in p.read_text() for p in Path('.pages-site').rglob('*.html'))"
          python assets/python/generate_cms_status.py --output .pages-site --mode production --ref main

          test -f .pages-site/index.html
          test -f .pages-site/404.html
          test -f .pages-site/assets/css/main.css
          test -f .pages-site/assets/js/main.js
          test -d .pages-site/pages
          test -d .pages-site/components

          # Technische Quellen gehören nicht ins veröffentlichte Artefakt.
          test ! -e .pages-site/assets/python
          test ! -e .pages-site/content
          test ! -e .pages-site/templates
          test ! -e .pages-site/.pages.yml

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .pages-site

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Veröffentlichungsstatus zusammenfassen
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BUILT_SHA: ${{ steps.build.outputs.built_sha }}
        run: |
          if [ "$DEPLOY_OUTCOME" = success ]; then
            echo '## Website erfolgreich veröffentlicht' >> "$GITHUB_STEP_SUMMARY"
            printf 'Veröffentlichter Commit: `%s`\n' "$BUILT_SHA" >> "$GITHUB_STEP_SUMMARY"
            echo '[Aktuellen Live-Stand prüfen](https://www.ttf-laudenbach.de/redaktionsstatus.html)' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$BUILD_OUTCOME" = failure ]; then
            echo '## Veröffentlichung nicht erfolgt – Inhaltsprüfung fehlgeschlagen' >> "$GITHUB_STEP_SUMMARY"
            echo 'Die bisherige Live-Version bleibt bestehen. Details stehen im fehlgeschlagenen Build-Schritt. Inhalt im CMS korrigieren und erneut speichern.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Veröffentlichung nicht bestätigt' >> "$GITHUB_STEP_SUMMARY"
            echo 'Prüfe die fehlgeschlagenen oder abgebrochenen Workflow-Schritte. Der Live-Stand ist maßgeblich.' >> "$GITHUB_STEP_SUMMARY"
          fi
