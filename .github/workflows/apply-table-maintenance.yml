name: Tabellen-Wartbarkeits-Cleanup anwenden

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: table-maintenance-cleanup
  cancel-in-progress: false

jobs:
  apply-cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tabellen-Cleanup anwenden
        run: python tools/table-maintenance/apply_table_maintenance.py

      - name: Zielzustand prüfen
        run: python tools/table-maintenance/apply_table_maintenance.py --check

      - name: JavaScript-Syntax prüfen
        shell: bash
        run: |
          node --check assets/js/config/table-configs.js
          node --check assets/js/features/tables.js
          node --check assets/js/features/table-responsive.js

      - name: Git-Diff prüfen
        run: git diff --check

      - name: Änderungen committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assets/js/config/table-configs.js \
            assets/js/features/tables.js \
            assets/js/features/table-responsive.js \
            assets/css/components/tables.css \
            assets/css/components/page-content.css \
            assets/css/components/robustness.css \
            assets/css/responsive.css

          if git diff --staged --quiet; then
            echo "Keine Änderungen gefunden."
            exit 0
          fi

          git commit -m "Tabellenstruktur und Responsive-Logik bereinigen"
          git pull --rebase origin main
          git push origin HEAD:main
