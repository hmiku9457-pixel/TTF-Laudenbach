name: UI-Update anwenden

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-update
  cancel-in-progress: false

jobs:
  apply-ui-update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python-Prüfabhängigkeiten installieren
        run: |
          python -m pip install \
            --disable-pip-version-check \
            "beautifulsoup4==4.13.4"

      - name: Generierte Testdateien entfernen
        run: |
          rm -rf \
            tools/review-upgrade/node_modules \
            tools/review-upgrade/playwright-report \
            tools/review-upgrade/test-results

      - name: UI-Update anwenden
        run: python tools/ui-update/apply_ui_update.py

      - name: CSS-Bundle mit zentralem Builder prüfen
        run: python tools/review-upgrade/build_css.py --check

      - name: Update-Struktur prüfen
        run: python tools/ui-update/verify_ui_update.py

      - name: JavaScript-Syntax prüfen
        run: |
          node --check assets/js/core/page-structure.js
          node --check assets/js/features/news-slider.js
          node --check assets/js/features/tables.js
          node --check assets/js/features/gallery.js

      - name: Bestehende Repository-Prüfung ausführen
        run: python tools/quality/check_site.py

      - name: Änderungen anzeigen
        run: |
          git diff --stat
          git status --short

      - name: Änderungen committen
        run: |
          # Bewusst alle Änderungen aufnehmen:
          # Neben dem UI-Update werden damit auch bereits versionierte
          # Playwright-/Node-Artefakte aus dem Repository entfernt.
          git add -A

          if git diff --cached --quiet; then
            echo "Keine Änderungen erforderlich."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m \
            "Fix responsive UI and remove generated test artifacts"
          git pull --rebase origin main
          git push origin HEAD:main
