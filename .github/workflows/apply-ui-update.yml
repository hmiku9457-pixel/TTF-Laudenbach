name: UI-Update anwenden

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-update
  cancel-in-progress: false

jobs:
  apply-ui-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python-Prüfabhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check "beautifulsoup4==4.13.4"

      - name: UI-Update anwenden
        run: python tools/ui-update/apply_ui_update.py

      - name: Update-Struktur prüfen
        run: python tools/ui-update/verify_ui_update.py

      - name: JavaScript-Syntax prüfen
        run: |
          node --check assets/js/core/page-structure.js
          node --check assets/js/features/news-slider.js
          node --check assets/js/features/tables.js
          node --check assets/js/features/gallery.js

      - name: Bestehende Repository-Prüfung ausführen
        run: python tools/quality/check_site.py

      - name: Änderungen anzeigen
        run: git diff --stat && git status --short

      - name: Änderungen committen
        run: |
          git add \
            assets/css/main.css \
            assets/css/site.bundle.css \
            assets/css/components/ui-fixes.css \
            assets/js/core/page-structure.js \
            assets/js/features/news-slider.js \
            assets/js/features/tables.js \
            assets/js/features/gallery.js \
            pages/unserVerein.html \
            pages/dokumente/historischeFotos.html
          if git diff --cached --quiet; then
            echo "Keine Änderungen erforderlich."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix responsive navigation, news, tables and gallery"
          git pull --rebase origin main
          git push origin HEAD:main
