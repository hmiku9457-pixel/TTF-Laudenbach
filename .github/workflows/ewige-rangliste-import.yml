name: Ewige Rangliste – Master importieren

on:
  push:
    branches: [main]
    paths:
      - "content/ewige-rangliste/import/*.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-writer
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Master und Deltas überprüfen
        run: python assets/python/ewige_rangliste.py build

      - name: Neue Masterdatei prüfen und aktivieren
        run: python assets/python/ewige_rangliste.py import-master

      - name: Aktualisierungen als einen Commit veröffentlichen
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/ewige-rangliste assets/data/ewigeRangliste.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Ewige Rangliste: neuen Master aktivieren"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: import
    if: needs.import.result == 'success' && needs.import.outputs.changed == 'true'
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
