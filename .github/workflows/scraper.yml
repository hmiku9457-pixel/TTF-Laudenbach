name: Auto-Update Daten

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: repository-writer
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.61.0"
          python -m playwright install --with-deps chromium

      - name: Vereinsdaten abrufen
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python assets/python/scraper.py

      - name: JSON-Dateien validieren
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          data_dir = Path("assets/data")
          files = sorted(data_dir.glob("*.json"))

          if not files:
              raise FileNotFoundError("Keine JSON-Dateien in assets/data gefunden.")

          for path in files:
              with path.open(encoding="utf-8") as file:
                  json.load(file)

              if path.stat().st_size == 0:
                  raise ValueError(f"Leere JSON-Datei: {path}")

          links_file = data_dir / "links.json"
          if not links_file.is_file():
              raise FileNotFoundError("assets/data/links.json fehlt.")

          links = json.loads(links_file.read_text(encoding="utf-8"))
          required_keys = {"spielplaene", "tabellen", "spielerlisten", "links"}
          missing = required_keys.difference(links)

          if missing:
              raise ValueError(
                  "links.json enthält nicht alle Pflichtbereiche: "
                  + ", ".join(sorted(missing))
              )

          print(f"{len(files)} JSON-Dateien erfolgreich validiert.")
          PY

      - name: Debug-Dateien bei Fehler hochladen
        if: failure() && hashFiles('debug/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-${{ github.run_id }}
          path: debug/
          retention-days: 7

      - name: Änderungen committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/data/*.json

          if git diff --staged --quiet; then
            echo "Keine Datenänderungen gefunden."
            exit 0
          fi

          git commit -m "Auto-Update Daten"
          git pull --rebase origin main
          git push origin HEAD:main
