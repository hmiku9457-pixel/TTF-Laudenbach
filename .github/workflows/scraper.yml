name: Auto-Update Daten

on:
  workflow_dispatch:
    inputs:
      allow_large_data_drop:
        description: "Großen Datenrückgang ausnahmsweise erlauben"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: repository-writer
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Playwright installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.62.0"
          python -m playwright install --with-deps chromium

      - name: Bestehenden Datenstand sichern
        run: cp -a assets/data .scraper-before

      - name: Vereinsdaten abrufen
        run: python assets/python/scraper.py

      - name: Kandidaten sichern und Produktivdaten wiederherstellen
        run: |
          cp -a assets/data .scraper-candidate
          rm -rf assets/data
          cp -a .scraper-before assets/data

      - name: Kandidaten gegen Schema und bisherigen Stand prüfen
        shell: bash
        run: |
          EXTRA_ARGS=()
          if [[ "${{ inputs.allow_large_data_drop }}" == "true" ]]; then
            EXTRA_ARGS+=(--allow-large-drop)
          fi
          python assets/python/validate_scraper_data.py \
            --before .scraper-before \
            --candidate .scraper-candidate \
            "${EXTRA_ARGS[@]}"

      - name: Validierte Daten übernehmen
        run: |
          rm -rf assets/data
          cp -a .scraper-candidate assets/data
          rm -rf .scraper-before .scraper-candidate

      - name: Debug-Dateien bei Fehler hochladen
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scraper-debug-${{ github.run_id }}
          path: |
            debug/
            .scraper-candidate/
          if-no-files-found: ignore
          retention-days: 7

      - name: Änderungen committen
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/data/*.json

          if git diff --staged --quiet; then
            echo "Keine Datenänderungen gefunden."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Auto-Update Daten"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: run-scraper
    if: >-
      needs.run-scraper.result == 'success' &&
      needs.run-scraper.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
