name: News CMS Paket 1 anwenden

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Paket 1 anwenden
        run: python tools/news-cms-package1/apply_news_package1.py

      - name: News-Abhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check -r assets/python/news_requirements.txt

      - name: Python-Syntax prüfen
        run: |
          python -m py_compile assets/python/generate_news.py
          python -m py_compile tools/news-cms-package1/apply_news_package1.py
          python -m py_compile tools/news-cms-package1/verify_news_package1.py

      - name: JavaScript-Syntax prüfen
        run: node --check assets/js/features/news-slider.js

      - name: News vollständig generieren
        run: python assets/python/generate_news.py

      - name: Paket 1 validieren
        run: python tools/news-cms-package1/verify_news_package1.py

      - name: Idempotenz des Generators prüfen
        run: |
          git diff --binary > /tmp/news-before.diff
          python assets/python/generate_news.py
          git diff --binary > /tmp/news-after.diff
          cmp /tmp/news-before.diff /tmp/news-after.diff

      - name: Diff auf Whitespace-Fehler prüfen
        run: git diff --check

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            README.md \
            index.html \
            sitemap.xml \
            assets/css/main.css \
            assets/css/components/news-content.css \
            assets/js/features/news-slider.js \
            assets/data/news.json \
            assets/python/generate_news.py \
            assets/python/news_requirements.txt \
            content/news \
            templates \
            docs/news-content-format.md \
            pages/neuigkeiten.html \
            pages/news

          if git diff --staged --quiet; then
            echo "Keine Änderungen gefunden."
            exit 0
          fi

          git status --short
          git commit -m "News-Content-System Paket 1 anwenden"
          git pull --rebase origin main
          git push origin main
