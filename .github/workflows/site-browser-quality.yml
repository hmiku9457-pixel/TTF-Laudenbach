name: TTF - Browser- und Layouttests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "components/**"
      - "index.html"
      - "pages/**/*.html"
      - "tests/e2e/**"
      - "package.json"
      - "playwright.config.mjs"
  pull_request:
    paths:
      - "assets/**"
      - "components/**"
      - "index.html"
      - "pages/**/*.html"
      - "tests/e2e/**"
      - "package.json"
      - "playwright.config.mjs"

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Abhängigkeiten installieren
        run: npm install
      - name: Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: Browsertests ausführen
        run: npm run test:e2e
      - name: Screenshots und Bericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
