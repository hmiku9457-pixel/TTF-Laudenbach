name: Generate Gallery JSON

on:
  push:
    branches: [main]
    paths:
      - "assets/images/**"
      - "!assets/images/seo/**"
      - "!assets/images/news/**"
      - "assets/python/generate_gallery.py"
      - ".github/workflows/generate-gallery-json.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-writer
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  generate-gallery-json:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Galerie-JSON erzeugen und validieren
        run: python assets/python/generate_gallery.py

      - name: Änderungen committen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/data/gallerie.json
          if git diff --staged --quiet; then
            echo "Keine Änderungen gefunden."
            exit 0
          fi

          git commit -m "Galerie JSON automatisch aktualisieren"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    needs: generate-gallery-json
    if: needs.generate-gallery-json.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
