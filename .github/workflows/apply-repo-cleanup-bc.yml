name: Repo-Cleanup B+C anwenden

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-writer
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Repo-Cleanup B+C anwenden
        run: python tools/repo-cleanup-bc/apply_repo_cleanup_bc.py

      - name: Syntax und Diff prüfen
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/repo-cleanup-bc/apply_repo_cleanup_bc.py
          find assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          git diff --check

          if git diff --name-only | grep -q '^\.github/workflows/'; then
            echo "Fehler: Das Cleanup-Script darf keine Workflow-Dateien verändern."
            git diff --name-only
            exit 1
          fi

      - name: Änderungen committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md assets/css assets/js

          if git diff --staged --quiet; then
            echo "Keine Änderungen gefunden."
            exit 0
          fi

          echo "Folgende Änderungen werden committed:"
          git diff --staged --stat
          git commit -m "Repo-Cleanup B+C anwenden"
          git pull --rebase origin main
          git push origin HEAD:main
