name: TTF - Architektur-Update anwenden

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur prüfen, nichts committen"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python-Prüfwerkzeuge installieren
        run: python -m pip install --disable-pip-version-check "beautifulsoup4==4.13.4"
      - name: Update anwenden
        run: python tools/site-modernization/apply_site_modernization.py
      - name: Generierte Dateien prüfen
        run: python tools/site-build/build_site.py
      - name: Bestehende Qualitätsprüfung ausführen
        run: |
          if [ -f tools/quality/check_site.py ]; then
            python tools/quality/check_site.py
          fi
      - name: JavaScript-Syntax prüfen
        run: |
          find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Änderungen anzeigen
        run: git status --short
      - name: Änderungen committen
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Keine Änderungen erforderlich."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: consolidate site architecture and tests"
          git push
