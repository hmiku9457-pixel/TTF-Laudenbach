name: Code-Cleanup A anwenden

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-writer
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Code-Cleanup anwenden
        run: python tools/code-cleanup-a/apply_cleanup_a.py

      - name: JavaScript-Syntax prüfen
        run: |
          node --check assets/js/core/http.js
          node --check assets/js/features/links.js

      - name: Python-Syntax prüfen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in [
              "assets/python/config.py",
              "assets/python/generate_news.py",
          ]:
              source = Path(name).read_text(encoding="utf-8")
              compile(source, name, "exec")
          print("Python-Syntax ok.")
          PY

      - name: Temporäre Paketdateien entfernen
        shell: bash
        run: |
          rm -rf tools/code-cleanup-a
          rm -f .github/workflows/apply-code-cleanup-a.yml

      - name: Änderungen committen
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            assets/js/core/http.js \
            assets/js/features/links.js \
            assets/css/components/news-slider.css \
            assets/css/components/gallery.css \
            assets/python/config.py \
            assets/python/generate_news.py \
            .github/workflows/apply-code-cleanup-a.yml \
            tools/code-cleanup-a

          if git diff --staged --quiet; then
            echo "Keine Änderungen gefunden."
            exit 0
          fi

          git status --short
          git commit -m "Finales Code-Cleanup anwenden"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    needs: cleanup
    if: needs.cleanup.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
