name: News CMS Paket 2 anwenden

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-writer
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Paket 2 anwenden
        run: python tools/news-cms-package2/apply_news_package2.py

      - name: Paket 2 validieren
        run: python tools/news-cms-package2/verify_news_package2.py

      - name: News-Abhängigkeiten installieren
        run: python -m pip install --disable-pip-version-check -r assets/python/news_requirements.txt

      - name: Bestehenden News-Zustand mit Generator prüfen
        run: |
          python assets/python/generate_news.py
          git diff --check

      - name: Temporäre Tool-Pakete entfernen
        run: |
          rm -rf tools/news-cms-package1
          rm -rf tools/news-cms-package2

      - name: Paket-Cleanup prüfen
        run: |
          test ! -e tools/news-cms-package1
          test ! -e tools/news-cms-package2
          test -f .github/workflows/generate-news.yml

      - name: Änderungen committen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            README.md \
            docs/news-content-format.md \
            assets/data/news.json \
            pages/neuigkeiten.html \
            pages/news \
            sitemap.xml \
            tools/news-cms-package1 \
            tools/news-cms-package2

          if git diff --staged --quiet; then
            echo "Keine Änderungen gefunden."
            exit 0
          fi

          git status --short
          git commit -m "News-Automatisierung Paket 2 anwenden"
          git pull --rebase origin main
          git push origin HEAD:main
