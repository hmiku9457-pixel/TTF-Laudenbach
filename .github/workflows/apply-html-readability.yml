name: Einmalige HTML-Bereinigung

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Node.js für Formatierung einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python-Abhängigkeit installieren
        run: python -m pip install --disable-pip-version-check "beautifulsoup4==4.13.4"

      - name: HTML-Struktur vereinfachen
        run: python tools/html-readability/apply_html_readability.py

      - name: HTML und zentrale Dateien formatieren
        run: |
          npx --yes prettier@3.6.2 \
            --write \
            --tab-width 4 \
            --print-width 120 \
            "index.html" \
            "404.html" \
            "pages/**/*.html" \
            "components/**/*.html" \
            "assets/js/main.js"

      - name: CSS-Bundle und Sitemap aktualisieren
        run: python tools/site/build.py --write

      - name: Statische Qualitätsprüfung
        run: python tools/quality/check_site.py

      - name: JavaScript-Syntax prüfen
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets/js -type f -name '*.js' -print0)

      - name: Änderungen anzeigen
        run: git status --short

      - name: Bereinigung committen
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Keine Änderungen erforderlich."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: HTML vereinfachen und formatieren"
          git push
