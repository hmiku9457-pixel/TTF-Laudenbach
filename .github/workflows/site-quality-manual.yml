name: Website-Qualität prüfen

on:
  workflow_dispatch:

  pull_request:
    paths:
      - "**/*.html"
      - "assets/css/**"
      - "assets/js/**"
      - "assets/data/**"
      - "sitemap.xml"
      - "robots.txt"
      - "tools/quality/**"
      - ".github/workflows/**"

  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "assets/css/**"
      - "assets/js/**"
      - "assets/data/**"
      - "sitemap.xml"
      - "robots.txt"
      - "tools/quality/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python-Prüfabhängigkeiten installieren
        run: |
          python -m pip install \
            --disable-pip-version-check \
            "beautifulsoup4==4.13.4"

      - name: HTML, JSON, Links und Imports prüfen
        run: python tools/quality/check_site.py

      - name: JavaScript-Syntax prüfen
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(
            find assets/js \
              -type f \
              -name '*.js' \
              -print0
          )
