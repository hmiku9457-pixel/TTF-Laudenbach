media:
  - name: news_images
    label: News-Bilder
    input: assets/images/news
    output: /assets/images/news
    extensions:
      - jpg
      - jpeg
      - png
      - webp
    categories:
      - image
    rename: safe
    commit:
      templates:
        create: "News-Bild hinzufügen: {filename}"
        update: "News-Bild aktualisieren: {filename}"
        delete: "News-Bild löschen: {filename}"
        rename: "News-Bild umbenennen: {oldFilename} -> {newFilename}"

  - {"name":"documents_media","label":"PDF-Dokumente","input":"pages/dokumente","output":"/pages/dokumente","extensions":["pdf"],"categories":["document"],"rename":"safe"}

  - {"name":"site_images","label":"Webseitenbilder","input":"assets/images/site","output":"/assets/images/site","extensions":["jpg","jpeg","png","webp"],"categories":["image"],"rename":"safe"}
  - {"name":"gallery_images","label":"Galeriebilder","input":"assets/images/gallery","output":"/assets/images/gallery","extensions":["jpg","jpeg","png","webp","gif"],"categories":["image"],"rename":"safe"}

components:
  news_text:
    type: object
    label: Text
    fields:
      - name: alignment
        label: Textausrichtung
        type: select
        required: true
        default: left
        options:
          values:
            - name: left
              label: Linksbündig
            - name: center
              label: Zentriert
      - name: body
        label: Text
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: false
          media: news_images
          extensions: [jpg, jpeg, png, webp]
          categories: [image]
          rename: safe

  news_two_columns:
    type: object
    label: Zwei Spalten
    fields:
      - name: left
        label: Linke Spalte
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: false
          media: news_images
          extensions: [jpg, jpeg, png, webp]
          categories: [image]
          rename: safe
      - name: right
        label: Rechte Spalte
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: false
          media: news_images
          extensions: [jpg, jpeg, png, webp]
          categories: [image]
          rename: safe

  news_event:
    type: object
    label: Eventankündigung
    fields:
      - name: title
        label: Event
        type: string
        required: true
        options:
          maxlength: 160
      - name: date
        label: Datum
        type: date
        required: true
        default: ""
        options:
          format: "yyyy-MM-dd"
      - name: time
        label: Uhrzeit
        type: string
        required: false
        description: "Optional, Format HH:MM, zum Beispiel 18:30."
        pattern:
          regex: "^$|^([01][0-9]|2[0-3]):[0-5][0-9]$"
          message: "Bitte eine Uhrzeit im Format HH:MM eingeben."
      - name: location
        label: Ort
        type: string
        required: false
        options:
          maxlength: 180
      - name: description
        label: Beschreibung
        type: rich-text
        required: false
        options:
          format: markdown
          switcher: false
          media: news_images
          extensions: [jpg, jpeg, png, webp]
          categories: [image]
          rename: safe

  news_divider:
    type: object
    label: Trenner
    fields:
      - name: enabled
        type: boolean
        default: true
        hidden: true

  news_spacer:
    type: object
    label: Abstand
    fields:
      - name: size
        label: Größe
        type: select
        required: true
        default: medium
        options:
          values:
            - name: small
              label: Klein
            - name: medium
              label: Mittel
            - name: large
              label: Groß

  page_text: {"type":"object","label":"Text","fields":[{"name":"alignment","label":"Textausrichtung","type":"select","required":true,"default":"left","options":{"values":[{"name":"left","label":"Linksbündig"},{"name":"center","label":"Zentriert"}]}},{"name":"body","label":"Text","type":"rich-text","required":true,"options":{"format":"markdown","switcher":false,"media":"site_images"}}]}
  page_columns: {"type":"object","label":"Zwei Spalten","fields":[{"name":"left","label":"Linke Spalte","type":"rich-text","required":true,"options":{"format":"markdown","switcher":false,"media":"site_images"}},{"name":"right","label":"Rechte Spalte","type":"rich-text","required":true,"options":{"format":"markdown","switcher":false,"media":"site_images"}}]}
  page_image: {"type":"object","label":"Einzelbild","fields":[{"name":"src","label":"Bild","type":"image","required":true,"options":{"media":"site_images"}},{"name":"alt","label":"Bildbeschreibung","type":"string","required":true},{"name":"caption","label":"Bildunterschrift","type":"string"}]}
  page_button: {"type":"object","label":"Schaltfläche (externe Webseite)","fields":[{"name":"label","label":"Beschriftung","type":"string","required":true},{"name":"url","label":"Webadresse","type":"string","required":true,"pattern":{"regex":"^https?://\\S+$","message":"Bitte vollständige Webadresse eingeben."}}]}
  page_download: {"type":"object","label":"PDF-Download","fields":[{"name":"label","label":"Beschriftung","type":"string","required":true},{"name":"path","label":"PDF-Datei","type":"file","required":true,"options":{"media":"documents_media"}}]}
  page_notice: {"type":"object","label":"Hinweisbox","fields":[{"name":"title","label":"Überschrift","type":"string","required":true},{"name":"body","label":"Text","type":"rich-text","required":true,"options":{"format":"markdown","switcher":false,"media":"site_images"}}]}

  page_three_columns: {"type":"object","label":"Drei Spalten","fields":[{"name":"left","label":"Linke Spalte","type":"rich-text","required":true,"options":{"format":"markdown","switcher":false,"media":"site_images"}},{"name":"middle","label":"Mittlere Spalte","type":"rich-text","required":true,"options":{"format":"markdown","switcher":false,"media":"site_images"}},{"name":"right","label":"Rechte Spalte","type":"rich-text","required":true,"options":{"format":"markdown","switcher":false,"media":"site_images"}}]}
  page_heading: {"type":"object","label":"Überschrift","fields":[{"name":"title","label":"Überschrift","type":"string","required":true}]}
  page_gallery: {"type":"object","label":"Bilderreihe","fields":[{"name":"images","label":"Bilder","type":"object","list":true,"options":{"summary":"{alt}"},"fields":[{"name":"src","label":"Bild","type":"image","required":true,"options":{"media":"site_images"}},{"name":"alt","label":"Bildbeschreibung","type":"string","required":true}]}]}

content:
  - name: news
    label: Neuigkeiten
    type: collection
    path: content/news
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{title}.md"
      field: false
    operations:
      create: true
      rename: false
      delete: true
    view:
      fields:
        - title
        - publish_at
        - summary
      primary: title
      sort:
        - publish_at
        - title
      search:
        - title
        - summary
      default:
        sort: publish_at
        order: desc
    commit:
      templates:
        create: "News erstellen: {filename}"
        update: "News aktualisieren: {filename}"
        delete: "News löschen: {filename}"
    fields:
      - name: title
        label: Titel
        type: string
        required: true
        description: "Titel des Artikels. Beim Erstellen wird daraus automatisch der dauerhafte Dateiname erzeugt."
      - name: publish_at
        label: Veröffentlichung
        type: date
        required: true
        description: "Standard ist der aktuelle Zeitpunkt. Ein zukünftiger Zeitpunkt plant die Veröffentlichung über den bestehenden GitHub-Workflow."
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm"
          step: 60
      - name: summary
        label: Kurzbeschreibung
        type: text
        required: false
        description: "Optionaler Teaser für Slider, Übersicht und SEO. Leer lassen, damit automatisch ein Teaser aus dem Artikelinhalt erzeugt wird."
        options:
          maxlength: 320
      - name: image
        label: Titelbild
        type: image
        required: true
        description: "Titelbild für Artikel, News-Übersicht und Slider."
        options:
          media: news_images
          extensions: [jpg, jpeg, png, webp]
          categories: [image]
          rename: safe
      - name: image_alt
        label: Bildbeschreibung
        type: string
        required: true
        description: "Kurze sachliche Beschreibung des Titelbilds für Barrierefreiheit."
        options:
          maxlength: 240
      - name: sections
        label: Artikelinhalt
        type: block
        required: true
        list: true
        blockKey: type
        description: "Artikel aus frei sortierbaren Inhaltsblöcken aufbauen. Die Eventankündigung ist vollständig optional und nur für passende Veranstaltungs-News gedacht."
        blocks:
          - name: text
            component: news_text
          - name: two_columns
            component: news_two_columns
          - name: event
            component: news_event
          - name: divider
            component: news_divider
          - name: spacer
            component: news_spacer


